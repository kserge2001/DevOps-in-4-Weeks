# Pattern D: the app in Kubernetes. The database stays on RDS, outside the cluster.
# Replace IMAGE, DB_HOST and DB_SECRET_ARN with the outputs of terraform/eks (the pipeline does this for you).
apiVersion: v1
kind: Namespace
metadata:
  name: quickshop
---
# Pod Identity links this service account to the IAM role quickshop-eks-app (read the DB secret).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quickshop
  namespace: quickshop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickshop
  namespace: quickshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quickshop
  template:
    metadata:
      labels:
        app: quickshop
    spec:
      serviceAccountName: quickshop
      containers:
        - name: app
          image: IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: PLATFORM
              value: eks
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: DB_HOST
              value: DB_HOST
            - name: DB_SECRET_ARN
              value: DB_SECRET_ARN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe: # in the Service only when the DB answers
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe: # restarted only if the process itself hangs (no DB check here)
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: quickshop
  namespace: quickshop
spec:
  selector:
    app: quickshop
  ports:
    - port: 80
      targetPort: 8080
---
# The AWS Load Balancer Controller turns this into an internet-facing ALB that sends traffic straight to pod IPs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quickshop
  namespace: quickshop
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quickshop
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quickshop
  namespace: quickshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quickshop
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
